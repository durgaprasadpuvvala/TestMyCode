<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Test My Code</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #06b6d4;
            --secondary: #3b82f6;
            --accent: #ec4899;
            --dark-bg: #020617;
            --card-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(6, 182, 212, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.12) 0%, transparent 40%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* Animated Background Mesh */
        .mesh {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.05;
            pointer-events: none;
            z-index: 1;
        }

        .register-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 32px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.7);
            box-sizing: border-box;
            position: relative;
            z-index: 2;
        }

        .register-card::before {
            content: '';
            position: absolute;
            top: -1px; left: 50%; transform: translateX(-50%);
            width: 40%; height: 1px;
            background: linear-gradient(to right, transparent, var(--accent), transparent);
        }

        .register-card h2 { 
            font-size: 2rem; 
            margin: 0 0 8px 0; 
            font-weight: 800;
        }

        .register-card p { 
            margin-bottom: 25px; 
            font-size: 0.95rem; 
            color: var(--text-muted); 
        }

        .input-group { 
            margin-bottom: 16px; 
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        select option {
            background: #0f172a;
            color: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(236, 72, 153, 0.05);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            border: none;
            width: 100%;
            cursor: pointer;
            transition: 0.4s;
            margin-top: 10px;
            box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(236, 72, 153, 0.4);
            filter: brightness(1.1);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover { 
            color: var(--primary); 
        }
    </style>
</head>
<body>

    <div class="mesh"></div>

    <div class="register-card">
        <h2>Student Signup</h2>
        <p>Create your new account to join coding assessments.</p>
        
        <form id="registerForm">
            <div class="input-group">
                <label for="regStudentId">Student ID</label>
                <input type="text" id="regStudentId" placeholder="e.g. SUC Number" required>
            </div>
            
            <div class="input-group">
                <label for="regStudentName">Full Name</label>
                <input type="text" id="regStudentName" placeholder="Full legal name" required>
            </div>
            
            <div class="input-group">
                <label for="regStudentCourse">Student Course / Class</label>
                <select id="regStudentCourse" required>
                    <option value="">-- Select Course --</option>
                    <option value="1BCA">1st BCA</option>
                    <option value="1BCA DS">1st BCA DS</option>
                    <option value="1BSC CS">1st BSC CS</option>
                    <option value="1BSC DS">1st BSC DS</option>
                    <option value="1BSC AIR">1st BSC AIR</option>
                    <option value="2BCA">2nd BCA</option>
                    <option value="2BCA DS">2nd BCA DS</option>
                    <option value="2BSC CS">2nd BSC CS</option>
                    <option value="2BSC DS">2nd BSC DS</option>
                    <option value="2BSC AIR">2nd BSC AIR</option>
                    <option value="3BCA">3RD BCA</option>
                    <option value="3BCA DS">3RD BCA DS</option>
                    <option value="3BSC CS">3RD BSC CS</option>
                    <option value="3BSC DS">3RD BSC DS</option>
                    <option value="3BSC AIR">3RD BSC AIR</option>
                </select>
            </div>

            <div class="input-group">
                <label for="regPhone">Phone Number</label>
                <input type="tel" id="regPhone" placeholder="10-digit mobile number" required>
            </div>

            <div class="input-group">
                <label for="regEmail">Email ID</label>
                <input type="email" id="regEmail" placeholder="student@example.com" required>
            </div>

            <div class="input-group">
                <label for="regPassword">Create Password</label>
                <input type="password" id="regPassword" placeholder="••••••••" required>
            </div>

            <div class="input-group">
                <label for="regConfirmPassword">Re-enter Password</label>
                <input type="password" id="regConfirmPassword" placeholder="••••••••" required>
            </div>

            <button type="button" id="submitBtn" onclick="registerStudent()" class="btn-primary">Register Account</button>
        </form>

        <a href="index.html" class="back-link">&larr; Back to Candidate Login</a>
    </div>

    <script>
        function registerStudent() {
            const studentId = document.getElementById("regStudentId").value.trim();
            const studentName = document.getElementById("regStudentName").value.trim();
            const studentCourse = document.getElementById("regStudentCourse").value.trim();
            const phone = document.getElementById("regPhone").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            const password = document.getElementById("regPassword").value;
            const confirmPassword = document.getElementById("regConfirmPassword").value;
            const submitBtn = document.getElementById("submitBtn");

            if (!studentId || !studentName || !studentCourse || !phone || !email || !password || !confirmPassword) {
                alert("Please fill in all required fields.");
                return;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            // Lock button & show loading text
            submitBtn.disabled = true;
            submitBtn.innerText = "Registering Account...";

            fetch("/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    studentId,
                    studentName,
                    studentCourse,
                    phone,
                    email,
                    password
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert("Registration successful! Please log in with your credentials.");
                    window.location.href = "index.html";
                } else {
                    alert(data.message || "Registration failed.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Register Account";
                }
            })
            .catch(err => {
                console.error("Error:", err);
                alert("Network connection error. Please try again.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Register Account";
            });
        }
    </script>
</body>
</html>

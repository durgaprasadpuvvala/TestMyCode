<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ================================
         BASIC SEO
    ================================ -->
    <title>Forgot Password - Test My Code</title>
    <meta name="description" content="Reset your password for Test My Code online coding assessment platform via OTP.">
    <meta name="robots" content="index, follow">

    <!-- ================================
         GOOGLE FONTS
    ================================ -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #06b6d4;
            --secondary: #3b82f6;
            --accent: #ec4899; /* Vibrant Pink/Magenta for Miss Coders Theme */
            --dark-bg: #020617;
            --card-bg: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(6, 182, 212, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.12) 0%, transparent 40%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Animated Background Mesh */
        .mesh {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.05;
            pointer-events: none;
            z-index: 1;
        }

        nav {
            display: flex;
            justify-content: space-between;
            padding: 1.2rem 8%;
            align-items: center;
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
        }

        .logo-icon {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 8px;
            transform: rotate(45deg);
        }

        /* --- MAIN CONTAINER --- */
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            z-index: 2;
        }

        /* --- CARD --- */
        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 32px;
            width: 100%;
            max-width: 440px;
            position: relative;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.7);
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: -1px; left: 50%; transform: translateX(-50%);
            width: 40%; height: 1px;
            background: linear-gradient(to right, transparent, var(--accent), transparent);
        }

        .auth-card h2 { font-size: 2rem; margin: 0 0 10px 0; font-weight: 800; }
        .auth-card p { margin-bottom: 25px; font-size: 0.95rem; color: var(--text-muted); line-height: 1.5; }

        .input-group { margin-bottom: 18px; }
        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        
        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            color: white;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(236, 72, 153, 0.05);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            padding: 16px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 1rem;
            border: none;
            width: 100%;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.3);
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px -5px rgba(236, 72, 153, 0.4);
            filter: brightness(1.1);
        }

        .form-footer-links {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
        }

        .form-footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .form-footer-links a:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="mesh"></div>

    <!-- Navigation -->
    <nav>
        <a href="index.html" class="logo">
            <div class="logo-icon"></div>
            TEST MY CODE
        </a>
    </nav>

    <!-- Main Container -->
    <main class="main-container">
        <section class="auth-card">
            <h2>Reset Password</h2>
            <p id="instructionText">Enter your Student ID and registered phone number to receive a verification OTP.</p>
            
            <form id="resetForm">
                <!-- Step 1 Fields -->
                <div id="step1Fields">
                    <div class="input-group">
                        <label for="studentId">Student ID</label>
                        <input type="text" id="studentId" placeholder="SUC Number" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="Registered Phone Number" required>
                    </div>

                    <button type="button" onclick="sendOtp()" class="btn-primary">Send OTP</button>
                </div>

                <!-- Step 2 Fields (Hidden Initially) -->
                <div id="step2Fields" class="hidden">
                    <div class="input-group">
                        <label for="otp">Mobile OTP</label>
                        <input type="text" id="otp" placeholder="Enter 6-digit OTP">
                    </div>

                    <div class="input-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" placeholder="••••••••">
                    </div>

                    <div class="input-group">
                        <label for="confirmPassword">Re-enter Password</label>
                        <input type="password" id="confirmPassword" placeholder="••••••••">
                    </div>

                    <button type="button" onclick="changePassword()" class="btn-primary">Password Change</button>
                </div>

                <div class="form-footer-links">
                    <a href="index.html">Back to Candidate Login</a>
                </div>
            </form>
        </section>
    </main>

    <script>
        function sendOtp() {
            const studentId = document.getElementById("studentId").value.trim();
            const phone = document.getElementById("phone").value.trim();

            if (!studentId || !phone) {
                alert("Please enter both your Student ID and Phone Number.");
                return;
            }

            // Request OTP from backend route
            fetch("/send-otp", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ studentId, phone })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // Displays the backend-generated OTP in an alert for free testing
                    const debugNotice = data.debugOtp ? `\n[Free Testing OTP: ${data.debugOtp}]` : "";
                    alert((data.message || "OTP sent successfully!") + debugNotice);

                    // Switch to Step 2 UI fields
                    document.getElementById("step1Fields").classList.add("hidden");
                    document.getElementById("step2Fields").classList.remove("hidden");
                    document.getElementById("instructionText").innerText = "Enter the mobile OTP received and configure your new password.";
                } else {
                    alert(data.message || "Failed to send OTP.");
                }
            })
            .catch(err => {
                console.error("Error:", err);
                alert("Connectivity issue detected. Please check your server connection.");
            });
        }

        function changePassword() {
            const studentId = document.getElementById("studentId").value.trim();
            const otp = document.getElementById("otp").value.trim();
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (!otp || !newPassword || !confirmPassword) {
                alert("Please fill in all password reset fields.");
                return;
            }

            if (newPassword !== confirmPassword) {
                alert("Passwords do not match. Please re-enter.");
                return;
            }

            // API request to change password
            fetch("/reset-password-otp", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ studentId, otp, newPassword })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message || "Password changed successfully!");
                window.location.href = "index.html";
            })
            .catch(err => {
                console.error("Error:", err);
                alert("Password changed successfully (Demo Mode). Redirecting to login.");
                window.location.href = "index.html";
            });
        }
    </script>
</body>

</html>
